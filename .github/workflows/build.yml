name: Build Custom Android OS

on:
  workflow_dispatch:

jobs:
  build-rom:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Free Up Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo apt-get clean

      - name: Install Build Dependencies
        run: |
          sudo apt-get update || true
          sudo apt-get install -y --fix-missing \
            bc bison build-essential ccache curl flex g++-multilib gcc-multilib \
            git gnupg gperf lib32ncurses-dev lib32z1-dev libgl1-mesa-dev \
            libxml2-utils xsltproc zip zlib1g-dev python3 python3-pip

      - name: Install Google Repo Tool
        run: |
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Initialize Source Tree
        run: |
          mkdir -p ~/android-rom
          cd ~/android-rom
          repo init -u https://github.com/LineageOS/android.git -b lineage-21.0 --git-lfs --depth=1
          repo sync -c -j$(nproc) --no-clone-bundle --no-tags

      - name: Build Android Image
        run: |
          cd ~/android-rom
          source build/envsetup.sh
          lunch lineage_sdk_gsi_x86_64-userdebug || lunch aosp_x86_64-userdebug
          mka -j$(nproc)
